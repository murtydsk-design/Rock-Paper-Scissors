<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <!-- Google Fonts: Lilita One (Game Title & Results) + Outfit (UI & Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <h1>Rock-Paper-Scissors Game</h1>
    </div>
    
    <div class="choices">
        <div class="choice" id="rock"><img src="Images/rock.png" alt="Rock"></div>
        <div class="choice" id="paper"><img src="Images/paper.png" alt="Paper"></div>
        <div class="choice" id="scissors"><img src="Images/scissors.png" alt="Scissors"></div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="computer-score">0</p>
            <p>Computer</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">Play your move </p>
    </div>
    <div class="reset-container">
        <button id="reset-btn">Reset Game</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
